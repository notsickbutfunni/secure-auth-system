<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Auth System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0e8;
      --card: #ffffff;
      --border: #c5d8d1;
      --accent: #6b9e95;
      --accent-pink: #d4a5a5;
      --text: #2c3e50;
      --muted: #7a8a8a;
      --error: #d4847d;
      --success: #8bb899;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Comfortaa', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0e8;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 1200px;
      height: 70vh;
      max-height: 600px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
    }
    .shell {
      width: min(900px, 90%);
      position: relative;
      z-index: 1;
    }
    .panel {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      position: relative;
      margin: 0 auto;
      max-width: 600px;
    }
    .panel > * {
      position: relative;
      z-index: 1;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .title { 
      font-size: 28px; 
      font-weight: 700; 
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .badge { 
      padding: 6px 12px; 
      border-radius: 999px; 
      background: rgba(107, 158, 149, 0.1);
      color: var(--accent); 
      border: 1.5px solid var(--border); 
      font-size: 13px;
      font-weight: 600;
    }
    .tabs { display: inline-flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 12px 18px;
      border-radius: 12px;
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .tab:hover {
      border-color: var(--accent);
      background: rgba(107, 158, 149, 0.08);
    }
    .tab.active { 
      background: var(--accent);
      border-color: var(--accent); 
      color: white;
    }
    form { display: grid; gap: 16px; margin-top: 12px; }
    label { font-size: 14px; color: var(--muted); font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: white;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Comfortaa', sans-serif;
    }
    input:focus { 
      border-color: var(--accent); 
      background: #fafafa;
    }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Comfortaa', sans-serif;
    }
    .primary { 
      background: var(--accent);
      color: white;
    }
    .primary:hover {
      transform: translateY(-2px);
    }
    button:active { transform: translateY(0); }
    .muted { color: var(--muted); font-size: 12px; font-weight: 500; }
    .log { margin-top: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; padding: 12px; border-radius: 8px; background: rgba(107, 158, 149, 0.05); }
    .log.error { color: var(--error); background: rgba(212, 132, 125, 0.1); }
    .log.success { color: var(--success); background: rgba(139, 184, 153, 0.1); }
    
    /* Falling Miku animation */
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
    .falling-miku {
      position: fixed;
      width: 50px;
      height: 50px;
      background-image: url('./miku-chibi.png');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 2000;
      animation: fall linear infinite;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="header">
        <div class="title">Secure Auth Console</div>
        <div class="badge">FastAPI · JWT · TOTP</div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>
      
      <form id="login-form" data-tab="login">
        <div>
          <label>Username</label>
          <input name="username" placeholder="alice" required />
        </div>
        <div>
          <label>Password</label>
          <input name="password" type="password" placeholder="SecureP@ss123!" required />
        </div>
        <div class="actions">
          <button type="submit" class="primary">Login</button>
        </div>
        <div id="login-log" class="log"></div>
      </form>

      <form id="register-form" data-tab="register" style="display:none;">
        <div>
          <label>Username</label>
          <input name="username" placeholder="alice" required />
        </div>
        <div>
          <label>Email</label>
          <input name="email" type="email" placeholder="alice@example.com" required />
        </div>
        <div>
          <label>Password</label>
          <input name="password" type="password" placeholder="SecureP@ss123!" required />
        </div>
        <div class="actions">
          <button type="submit" class="primary">Register</button>
          <span class="muted">Save the TOTP secret in your authenticator.</span>
        </div>
        <div id="register-log" class="log"></div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    // Create falling Miku
    function createFallingMiku() {
      const miku = document.createElement('div');
      miku.className = 'falling-miku';
      miku.style.left = Math.random() * 100 + 'vw';
      miku.style.animationDuration = (Math.random() * 3 + 4) + 's';
      miku.style.opacity = Math.random() * 0.5 + 0.3;
      document.body.appendChild(miku);
      
      setTimeout(() => {
        miku.remove();
      }, 7000);
    }
    
    // Create Miku every 800ms
    setInterval(createFallingMiku, 800);
  </script>
</body>
</html>
